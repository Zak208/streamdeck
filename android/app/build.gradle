plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zak208.streamdesk'
    compileSdk 34

    defaultConfig {
        applicationId "com.zak208.streamdesk"
        minSdk 24
        targetSdk 34
        versionCode 22000
        versionName "2.20.0"
    }

    // One fixed key for every release, so a new APK installs over the old one and keeps the pairing.
    // The key is not in the repository: CI restores it from GitHub secrets and points STREAMDESK_KEYSTORE at it.
    // Without it (a local build) the APK is signed with Android's own debug key, which is fine to try the app
    // but cannot update a release build.
    def keystorePath = System.getenv('STREAMDESK_KEYSTORE')
    def hasReleaseKey = keystorePath && file(keystorePath).exists()

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('STREAMDESK_KEYSTORE_PASSWORD')
                keyAlias 'streamdesk'
                keyPassword System.getenv('STREAMDESK_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // QR scanner that works without Google Play Services
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
