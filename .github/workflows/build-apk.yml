name: Build Android APK

# The APK is built when android/ changes (to catch a broken build early) and whenever a Release is published,
# which is when it is attached as StreamDesk.apk: the fixed name the app's download link points to
# (releases/latest/download/StreamDesk.apk). Run it by hand with a tag to attach it to an older Release.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the APK to (for example v2.18.0). Leave empty to only build.'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # On a Release, build the code of that tag, not whatever main is now.
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # The signing key lives in GitHub secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD).
      # An APK attached to a Release must carry it: with a different key phones refuse to update over the old app.
      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          IS_RELEASE: ${{ github.event_name == 'release' || inputs.tag != '' }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            if [ "$IS_RELEASE" = "true" ]; then
              echo "::error::Missing secret ANDROID_KEYSTORE_BASE64: refusing to publish an APK signed with another key."
              exit 1
            fi
            echo "::warning::No signing key secret: building with a throwaway debug key (not publishable)."
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/streamdesk.keystore"
            echo "STREAMDESK_KEYSTORE=$RUNNER_TEMP/streamdesk.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build signed APK
        working-directory: android
        env:
          STREAMDESK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk StreamDesk.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamDesk-Android-APK
          path: StreamDesk.apk

      - name: Attach the APK to the Release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" StreamDesk.apk --clobber --repo "$GITHUB_REPOSITORY"
