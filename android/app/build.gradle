plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zak208.streamdesk'
    compileSdk 34

    defaultConfig {
        applicationId "com.zak208.streamdesk"
        minSdk 24
        targetSdk 34
        versionCode 21800
        versionName "2.18.0"
    }

    // One fixed key for every build, so a new APK installs over the old one and keeps the pairing.
    // It is a sideloading key (the app is not on Google Play): its password is public on purpose.
    signingConfigs {
        release {
            storeFile file('../streamdesk.keystore')
            storePassword 'streamdesk'
            keyAlias 'streamdesk'
            keyPassword 'streamdesk'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // QR scanner that works without Google Play Services
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
